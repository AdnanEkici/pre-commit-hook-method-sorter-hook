[project]
name = "method-sorter-hook"
version = "0.1.0"
description = "A pre-commit hook that sorts Python class methods by group."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "libcst>=1.0.0",
]

[project.scripts]
method-sorter-hook = "hook.command_line:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hook"]